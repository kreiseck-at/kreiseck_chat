name: kreiseck_chat
description: "Reusable, backend-agnostic chat UI widgets and models for Flutter apps."
version: 0.18.1
repository: https://github.com/kreiseck/kreiseck_chat
homepage: https://github.com/kreiseck/kreiseck_chat
topics:
  - chat
  - messaging
  - ui

environment:
  sdk: ^3.12.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # Bilder landen auf der Platte, statt bei jedem Öffnen neu geladen zu werden.
  # Austauschbar über ChatTheme.imageProvider.
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

