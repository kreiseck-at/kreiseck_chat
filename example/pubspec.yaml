name: kreiseck_chat_example
description: "Example app demonstrating kreiseck_chat widgets."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  kreiseck_chat:
    path: ../
  # Nur das Beispiel hängt daran: es zeigt die Verdrahtung des
  # ChatAudioPlaybackController. Das Paket selbst bleibt ohne Audio-Plugin.
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
